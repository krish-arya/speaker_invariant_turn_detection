[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "turnsense"
version = "0.1.0"
description = "Speaker-invariant turn detection for a real-time voice-to-voice agent (research + runtime)."
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "websockets>=12",
]

[project.optional-dependencies]
# Real-time transport: LiveKit room tokens + the agent worker.
livekit = [
  "livekit>=1.0",
  "livekit-api>=1.0",
  "livekit-agents>=1.0",
  "livekit-plugins-silero>=1.0",
]
# Silero VAD through ONNX Runtime (no torch needed at runtime).
vad = ["onnxruntime>=1.18"]
# Model training, evaluation and the learned detector runtime.
research = [
  "torch>=2.3",
  "soundfile>=0.12",
]
# Local/open fallbacks for the reproducible benchmark profile.
local = [
  "faster-whisper>=1.0",
  "kokoro>=0.9",
]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
]

[project.scripts]
turnsense-api = "turnsense.api.app:main"
turnsense-worker = "turnsense.worker.agent:main"
turnsense-research = "turnsense.research.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/turnsense"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]
